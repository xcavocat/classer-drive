<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Connexion Google Drive</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="config.js"></script>
<style>body{font-family:"Segoe UI",system-ui,sans-serif;color:#1f2a44;padding:24px;font-size:14px}</style>
</head>
<body>
<p id="msg">Redirection vers Google...</p>
<script>
Office.onReady(function () {
  var h = new URLSearchParams(location.hash.slice(1));
  if (h.get("access_token")) {
    document.getElementById("msg").textContent = "Connexion réussie.";
    Office.context.ui.messageParent(JSON.stringify({
      token: h.get("access_token"),
      expiresIn: Number(h.get("expires_in") || 3600)
    }));
  } else if (h.get("error") || new URLSearchParams(location.search).get("error")) {
    var err = h.get("error") || new URLSearchParams(location.search).get("error");
    Office.context.ui.messageParent(JSON.stringify({ error: err }));
  } else {
    var p = new URLSearchParams({
      client_id: new URLSearchParams(location.search).get("cid") || CONFIG.GOOGLE_CLIENT_ID,
      redirect_uri: location.origin + location.pathname,
      response_type: "token",
      scope: CONFIG.SCOPE,
      include_granted_scopes: "true"
    });
    location.href = "https://accounts.google.com/o/oauth2/v2/auth?" + p.toString();
  }
});
</script>
</body>
</html>
