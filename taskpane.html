<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classer dans Drive</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="config.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <h1>Classer dans Drive</h1>
  <div id="account" class="account hidden"><span id="accountEmail"></span> <button id="btnLogout" class="link">Déconnecter</button></div>
</header>

<section id="empty" class="pad hidden"><p class="muted">Sélectionne un mail pour le classer.</p></section>

<main id="main" class="hidden">
  <div id="filed" class="filed hidden"></div>
  <section class="block">
    <p id="mSubject" class="subject"></p>
    <p id="mMeta" class="muted small"></p>
    <label class="field"><span>Nom des fichiers</span><input id="baseName" type="text" spellcheck="false"></label>
  </section>

  <section class="block">
    <h2>À enregistrer</h2>
    <label class="check"><input type="checkbox" id="optEml" checked> <span>Mail original (.eml)</span></label>
    <label class="check"><input type="checkbox" id="optPdf" checked> <span>Mail en PDF</span></label>
    <div id="attList"></div>
    <details class="more">
      <summary>Options</summary>
      <label class="check"><input type="checkbox" id="optPrefix" checked> <span>Préfixer les pièces jointes par la date du mail</span></label>
      <label class="check"><input type="checkbox" id="optSub"> <span>Créer un sous-dossier au nom du mail</span></label>
      <label class="check"><input type="checkbox" id="optTag" checked> <span>Marquer le mail dans Outlook avec une catégorie au nom du dossier</span></label>
    </details>
  </section>

  <section id="auth" class="block hidden">
    <p>Connecte ton Google Drive pour choisir le dossier de destination.</p>
    <div id="cidRow" class="hidden">
      <label class="field"><span>ID client Google (à coller une seule fois)</span><input id="clientId" type="text" spellcheck="false" placeholder="xxxx.apps.googleusercontent.com"></label>
      <p class="muted small">Adresse de redirection à déclarer chez Google :<br><code id="redirectUri"></code></p>
    </div>
    <button id="btnConnect" class="primary">Connecter Google Drive</button>
  </section>

  <section id="pick" class="block hidden">
    <h2>Dossier de destination</h2>
    <div id="suggest"></div>
    <input id="search" type="search" placeholder="Rechercher un dossier" autocomplete="off">
    <nav id="crumbs" class="crumbs"></nav>
    <ul id="folders" class="folders"></ul>
    <div id="newFolderRow" class="inline hidden">
      <input id="newFolderName" type="text" placeholder="Nom du nouveau dossier">
      <button id="btnCreate">Créer</button>
    </div>
    <div class="tools">
      <button id="btnNewFolder" class="link">Nouveau dossier ici</button>
      <button id="btnSetRoot" class="link">Définir comme racine</button>
    </div>
  </section>
</main>

<footer id="footer" class="hidden">
  <div id="dest" class="tab empty">Aucun dossier choisi</div>
  <button id="btnSave" class="primary wide" disabled>Enregistrer dans Drive</button>
  <div id="status" class="status small"></div>
</footer>

<script src="app.js"></script>
</body>
</html>
